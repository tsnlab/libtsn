# tsn-xdma DKMS 설정.
# 커널을 갱신하면 DKMS 가 xdma.ko 를 새 커널용으로 다시 빌드한다.
# 설치는 driver/dkms/install.sh 로 한다. 이 파일을 직접 dkms add 하지 않는다.
#
# VERSION: install.sh 가 설치 시 이 값을 바꾼다(--version 인자, 보통 git short SHA).
# 인자가 없으면 1.0.0 을 쓴다.
VERSION="1.0.0"

PACKAGE_NAME="tsn-xdma"
PACKAGE_VERSION="${VERSION}"

# 커널 kbuild 를 직접 부른다(M= 외부 모듈). DKMS 는 make 명령에 KERNELRELEASE=<대상 커널> 을 넣는데,
# xdma/Makefile 의 all 대상은 KERNELRELEASE 가 비었을 때만 있어 "No rule to make target 'all'" 이 난다(2026-10-12 실측).
# 대상 커널 헤더(${kernel_source_dir})로 빌드하므로 실행 중이 아닌 커널용 빌드도 맞는 헤더를 쓴다.
# FPU/SIMD 플래그(-msse2 등)를 더하지 않는다. 사용자 프로세스 손상 원인이었다(2026-10-07).
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/xdma modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/xdma clean"

BUILT_MODULE_NAME[0]="xdma"
BUILT_MODULE_LOCATION[0]="xdma/"
# /extra 를 쓴다. 기존 /etc/modprobe.d/tsn-xdma.conf 의 install 줄과 맞춘다.
DEST_MODULE_LOCATION[0]="/extra"

# 빌드 뒤 xdma.ko 에 SSE/AVX 레지스터 사용이 없는지 검사한다(x86_64).
POST_BUILD="dkms/check_nofpu.sh"

AUTOINSTALL="yes"
